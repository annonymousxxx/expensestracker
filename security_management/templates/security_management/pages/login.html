{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-4">
  <div class="row justify-content-center min-vh-75 align-items-center">
    <div class="col-lg-4 col-md-6">
      <!-- Login Card -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="auth-icon mx-auto mb-3">
              <i class="fas fa-lock fa-2x"></i>
            </div>
            <h3 class="fw-bold mb-1">Welcome Back!</h3>
            <p class="text-muted mb-0">Login to track your expenses</p>
          </div>

          <!-- Messages -->
          {% if messages %}
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          {% endfor %}
          {% endif %}

          <!-- Login Form -->
          <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
              <label for="id_username" class="form-label fw-semibold">
                <i class="fas fa-user me-2 text-primary"></i>Username
              </label>
              <input type="text" name="username" id="id_username" class="form-control form-control-lg"
                placeholder="Enter your username" required autofocus>
            </div>

            <div class="mb-4">
              <label for="id_password" class="form-label fw-semibold">
                <i class="fas fa-key me-2 text-primary"></i>Password
              </label>
              <input type="password" name="password" id="id_password" class="form-control form-control-lg"
                placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
          </form>

          <!-- Register Link -->
          <div class="text-center">
            <p class="text-muted mb-0">
              Don't have an account?
              <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .auth-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
  }

  .min-vh-75 {
    min-height: 75vh;
  }
</style>
{% endblock %}
