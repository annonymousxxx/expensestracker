{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-4 py-5">
  <div class="row justify-content-center min-vh-75 align-items-center">
    <div class="col-lg-5 col-md-7">
      <!-- Login Card -->
      <div class="auth-card card border-0">
        <div class="card-body p-4 p-md-5">
          <!-- Header -->
          <div class="text-center mb-4">
            <!-- Back Button -->
            <a href="/" class="back-btn">
              <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="auth-icon-wrapper mb-4">
              <div class="auth-icon">
                <i class="fas fa-lock fa-3x"></i>
              </div>
            </div>
            <h2 class="fw-bold mb-2 gradient-text">Welcome Back!</h2>
            <p class="text-muted fs-6">Login to track your expenses 💰</p>
          </div>

          <!-- Messages -->
          {% if messages %}
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-modern alert-dismissible fade show" role="alert">
            <i class="fas fa-info-circle me-2"></i>{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          {% endfor %}
          {% endif %}

          <!-- Login Form -->
          <form method="POST" id="loginForm">
            {% csrf_token %}

            <div class="mb-4 form-group-modern">
              <label for="id_username" class="form-label">
                <i class="fas fa-user me-2 label-icon"></i>Username
              </label>
              <div class="input-wrapper">
                <input type="text" name="username" id="id_username" class="form-control form-control-lg"
                  placeholder="Enter your username" required autofocus>
                <div class="input-underline"></div>
              </div>
            </div>

            <div class="mb-4 form-group-modern">
              <label for="id_password" class="form-label">
                <i class="fas fa-key me-2 label-icon"></i>Password
              </label>
              <div class="input-wrapper password-wrapper">
                <input type="password" name="password" id="id_password" class="form-control form-control-lg"
                  placeholder="Enter your password" required>
                <button type="button" class="password-toggle" onclick="togglePassword()">
                  <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
                <div class="input-underline"></div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-4 submit-btn">
              <i class="fas fa-sign-in-alt me-2"></i>Login
              <span class="btn-shine"></span>
            </button>
          </form>

          <!-- Register Link -->
          <div class="text-center">
            <p class="text-muted mb-0">
              Don't have an account?
              <a href="{% url 'register' %}" class="link-gradient fw-semibold">Register here</a>
            </p>
          </div>
        </div>
      </div>

      <!-- Security Note -->
      <div class="security-note mt-4 text-center">
        <i class="fas fa-shield-alt me-2"></i>
        <small class="text-muted">Your data is secure and encrypted</small>
      </div>
    </div>
  </div>
</div>

<style>
  .gradient-text {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .back-btn {
    display: inline-block;
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  .back-btn:hover {
    background: rgba(102, 126, 234, 0.1);
    color: #667eea;
    transform: translateX(-3px);
  }

  .back-btn i {
    margin-right: 0.5rem;
  }

  .min-vh-75 {
    min-height: 75vh;
  }

  .auth-card {
    background: var(--bg-secondary);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    border-radius: 24px;
    animation: fadeInUp 0.6s ease-out;
    position: relative;
    overflow: hidden;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .auth-icon-wrapper {
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {

    0%,
    100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-10px);
    }
  }

  .auth-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    margin: 0 auto;
  }

  .form-group-modern {
    position: relative;
  }

  .form-label {
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
  }

  .label-icon {
    color: var(--accent-purple);
  }

  .input-wrapper {
    position: relative;
  }

  .password-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.5rem;
    transition: color 0.3s ease;
    z-index: 10;
  }

  .password-toggle:hover {
    color: var(--accent-purple);
  }

  .form-control {
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 0.875rem 1.25rem;
    font-size: 1rem;
    font-weight: 500;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    transition: all 0.3s ease;
  }

  .password-wrapper .form-control {
    padding-right: 3rem;
  }

  .form-control:focus {
    border-color: var(--accent-purple);
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    background: var(--bg-secondary);
    outline: none;
  }

  .input-underline {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .form-control:focus~.input-underline {
    width: 100%;
  }

  .submit-btn {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    transition: all 0.3s ease;
    font-weight: 600;
  }

  .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
  }

  .btn-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .submit-btn:hover .btn-shine {
    left: 100%;
  }

  .link-gradient {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
    position: relative;
    transition: all 0.3s ease;
  }

  .link-gradient:hover {
    text-decoration: underline;
  }

  .alert-modern {
    border: none;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    animation: slideDown 0.4s ease-out;
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .alert-success {
    background: linear-gradient(135deg, rgba(67, 233, 123, 0.1) 0%, rgba(56, 189, 248, 0.1) 100%);
    color: #059669;
    border-left: 4px solid #43e97b;
  }

  .alert-error,
  .alert-danger {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(220, 38, 38, 0.1) 100%);
    color: #dc2626;
    border-left: 4px solid #ef4444;
  }

  .security-note {
    animation: fadeIn 0.8s ease-out 0.3s both;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  /* Dark Mode Adjustments */
  [data-theme="dark"] .auth-card {
    background: var(--bg-secondary);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  [data-theme="dark"] .form-control {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-color: var(--border-color);
  }

  [data-theme="dark"] .form-control:focus {
    background: var(--bg-secondary);
  }

  [data-theme="dark"] .alert-success {
    background: linear-gradient(135deg, rgba(67, 233, 123, 0.15) 0%, rgba(56, 189, 248, 0.15) 100%);
    color: #6ee7b7;
  }

  [data-theme="dark"] .alert-error,
  [data-theme="dark"] .alert-danger {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(220, 38, 38, 0.15) 100%);
    color: #fca5a5;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .auth-card .card-body {
      padding: 2rem 1.5rem;
    }

    .auth-icon {
      width: 80px;
      height: 80px;
    }

    .auth-icon i {
      font-size: 2rem;
    }
  }
</style>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById('id_password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.classList.remove('fa-eye');
      toggleIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      toggleIcon.classList.remove('fa-eye-slash');
      toggleIcon.classList.add('fa-eye');
    }
  }

  // Add loading state on submit
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function (e) {
      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';
      submitBtn.disabled = true;
    });
  });
</script>
{% endblock %}
