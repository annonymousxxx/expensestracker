databases:
  - name: expensestracker_db
    databaseName: expensestracker_db
    user: expensestracker_user

services:
  - type: web
    name: expensestracker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn AnExpensesTrackingAppwithCloudBackup.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expensestracker_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WEB_CONCURRENCY
        value: 4
