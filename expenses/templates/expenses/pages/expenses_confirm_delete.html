{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-4 py-4">
  <div class="row justify-content-center min-vh-75 align-items-center">
    <div class="col-lg-5 col-md-7">
      <!-- Warning Card -->
      <div class="warning-card card border-0">
        <div class="card-body p-4 p-md-5 text-center">
          <!-- Warning Icon -->
          <div class="warning-icon-wrapper mb-4">
            <div class="warning-icon">
              <i class="fas fa-exclamation-triangle fa-3x"></i>
            </div>
          </div>

          <!-- Title -->
          <h2 class="fw-bold mb-2">Delete This Expense?</h2>
          <p class="text-muted mb-4 fs-6">This action cannot be undone ⚠️</p>

          <!-- Expense Details -->
          <div class="expense-preview mb-4">
            <div class="mb-3">
              <span class="category-badge">{{ expense.category }}</span>
            </div>
            <h4 class="fw-bold mb-2">{{ expense.title }}</h4>
            <p class="amount-display mb-2">₱{{ expense.amount|floatformat:2 }}</p>
            <small class="text-muted">
              <i class="far fa-calendar me-1"></i>{{ expense.date|date:"M d, Y" }}
            </small>
          </div>

          <!-- Confirmation Form -->
          <form method="post" id="deleteForm">
            {% csrf_token %}
            <div class="d-flex gap-3">
              <button type="submit" class="btn btn-danger btn-lg flex-fill delete-btn">
                <i class="fas fa-trash me-2"></i>Yes, Delete It
                <span class="btn-shine"></span>
              </button>
              <a href="{% url 'expense_detail' expense.pk %}" class="btn btn-outline-secondary btn-lg">
                <i class="fas fa-times"></i>
              </a>
            </div>
          </form>
        </div>
      </div>

      <!-- Info Note -->
      <div class="info-note text-center mt-4">
        <i class="fas fa-info-circle me-2"></i>
        <small class="text-muted">You can always add it back later if needed</small>
      </div>
    </div>
  </div>
</div>

<style>
  .min-vh-75 {
    min-height: 75vh;
  }

  .warning-card {
    background: var(--bg-secondary);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    border-radius: 24px;
    animation: fadeInUp 0.6s ease-out;
    position: relative;
    overflow: hidden;
  }

  .warning-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(135deg, #ffe066 0%, #ff9966 100%);
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .warning-icon-wrapper {
    display: inline-block;
    animation: shake 2s ease-in-out infinite;
  }

  @keyframes shake {

    0%,
    100% {
      transform: rotate(0deg);
    }

    10%,
    30%,
    50%,
    70%,
    90% {
      transform: rotate(-5deg);
    }

    20%,
    40%,
    60%,
    80% {
      transform: rotate(5deg);
    }
  }

  .warning-icon {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, #ffe066 0%, #ff9966 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 10px 30px rgba(255, 153, 102, 0.4);
    margin: 0 auto;
  }

  .expense-preview {
    padding: 1.5rem;
    background: linear-gradient(135deg, rgba(220, 53, 69, 0.05) 0%, rgba(200, 35, 51, 0.05) 100%);
    border: 2px solid rgba(220, 53, 69, 0.2);
    border-radius: 16px;
    transition: all 0.3s ease;
  }

  .expense-preview:hover {
    border-color: rgba(220, 53, 69, 0.3);
    box-shadow: 0 8px 24px rgba(220, 53, 69, 0.1);
  }

  .category-badge {
    padding: 6px 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
  }

  .amount-display {
    background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 1.75rem;
    font-weight: 800;
  }

  .delete-btn {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    border: none;
    box-shadow: 0 8px 24px rgba(220, 53, 69, 0.3);
    transition: all 0.3s ease;
  }

  .delete-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(220, 53, 69, 0.4);
  }

  .btn-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s ease;
  }

  .delete-btn:hover .btn-shine {
    left: 100%;
  }

  .btn-outline-secondary {
    border: 2px solid var(--border-color);
    color: var(--text-secondary);
    transition: all 0.3s ease;
  }

  .btn-outline-secondary:hover {
    background: var(--text-secondary);
    border-color: var(--text-secondary);
    color: white;
    transform: translateY(-3px);
  }

  .info-note {
    animation: fadeIn 0.8s ease-out 0.3s both;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  .info-note i {
    color: var(--accent-purple);
  }

  /* Dark Mode Adjustments */
  [data-theme="dark"] .warning-card {
    background: var(--bg-secondary);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  [data-theme="dark"] .expense-preview {
    background: linear-gradient(135deg, rgba(220, 53, 69, 0.1) 0%, rgba(200, 35, 51, 0.1) 100%);
    border-color: rgba(220, 53, 69, 0.3);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .warning-card .card-body {
      padding: 2rem 1.5rem;
    }

    .warning-icon {
      width: 80px;
      height: 80px;
    }

    .warning-icon i {
      font-size: 2rem;
    }

    .amount-display {
      font-size: 1.5rem;
    }
  }
</style>

<script>
  // Add loading state on submit
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('deleteForm');
    form.addEventListener('submit', function (e) {
      const submitBtn = form.querySelector('.delete-btn');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Deleting...';
      submitBtn.disabled = true;
    });
  });
</script>
{% endblock %}
